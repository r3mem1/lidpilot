<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ title }} — LeadPilot</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="/static/js/app.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
  {% block body %}{% endblock %}
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog class="dialog" id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Подтвердите действие</h2>
      <p id="confirm-text"></p>
      <div class="form-actions">
        <button class="btn btn--danger" value="ok" id="confirm-ok">Подтвердить</button>
        <button class="btn" value="cancel">Отмена</button>
      </div>
    </form>
  </dialog>
</body>
</html>
