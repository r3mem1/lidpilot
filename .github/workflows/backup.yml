# Ежедневный зашифрованный бэкап боевой БД PostgreSQL/Supabase (ТЗ §18, этап 7).
# На бесплатном тарифе Supabase своих бэкапов нет — выгрузку делаем сами.
# Секреты (Settings → Secrets and variables → Actions → Repository secrets):
#   PROD_DATABASE_URL  — строка Session pooler боевой БД (можно с «+psycopg2», скрипт уберёт)
#   BACKUP_PASSPHRASE  — фраза шифрования; без неё бэкап не расшифровать (хранить в менеджере паролей)
# Репозиторий должен быть Private: артефакт содержит данные клиентов (в зашифрованном виде).
name: db-backup

on:
  schedule:
    - cron: "17 3 * * *" # ежедневно 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # pg_dump должен быть не старше сервера: у Supabase PostgreSQL 17, на раннере по умолчанию 16.
      - name: Установить PostgreSQL client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Выгрузить и зашифровать
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PROD_DATABASE_URL" || { echo "Секрет PROD_DATABASE_URL не задан"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "Секрет BACKUP_PASSPHRASE не задан"; exit 1; }
          URL="${PROD_DATABASE_URL/+psycopg2/}"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          # Только схема public (наши таблицы); служебные схемы Supabase не нужны.
          pg_dump "$URL" --schema=public --no-owner --no-privileges --format=custom --file=leadpilot.dump
          # Защита от «пустого» бэкапа: в дампе должны быть наши таблицы.
          pg_restore --list leadpilot.dump | grep -q "TABLE public users" || { echo "В дампе нет таблицы users"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" --output "leadpilot-$STAMP.dump.gpg" leadpilot.dump
          rm -f leadpilot.dump
          ls -l leadpilot-*.dump.gpg

      - name: Сохранить артефакт (30 суток)
        uses: actions/upload-artifact@v4
        with:
          name: leadpilot-db-backup
          path: leadpilot-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
